<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://iqcwrberwzumxxjktgux.supabase.co wss://iqcwrberwzumxxjktgux.supabase.co; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<title>Reset Password - GTI Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
<script src="theme.js"></script>
<link rel="icon" type="image/x-icon" href="gti.png">
</head>
<body>

<div class="auth-screen">
  <div class="auth-visual grid-texture">
    <span class="brand-mark">GTI</span>
    <h1>Government Technical Institute</h1>
    <p>Choose a new password for your account.</p>
  </div>

  <div class="auth-panel">
    <button type="button" class="btn-icon-light theme-toggle-corner" id="themeToggleBtn" aria-label="Toggle dark mode">☾</button>

    <h2>Reset your password</h2>
    <p class="subtitle">Enter a new password below.</p>

    <div id="resetFormWrap">
      <form id="resetForm" class="auth-form active" novalidate>
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128">
        <p class="field-hint">At least 8 characters. Longer, unique passwords are safer than complex short ones.</p>

        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="8" maxlength="128">

        <p class="status-message" id="resetStatus" role="alert"></p>

        <button type="submit" class="btn btn-block" id="resetSubmit">Update password</button>
      </form>
    </div>

    <!-- Shown instead of the form when the recovery link is missing,
         already used, or expired — see reset-password.js. -->
    <div id="resetInvalid" hidden>
      <p class="status-message error visible" role="alert" id="resetInvalidText"></p>
      <p style="margin-top:20px; font-size:0.85rem;"><a href="index.html">← Back to sign in</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=2"></script>
<script src="reset-password.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://iqcwrberwzumxxjktgux.supabase.co; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<title>Staff Login - GTI Staff Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<link rel="icon" type="image/x-icon" href="gti.png">
</head>
<body>

<div class="auth-screen">
  <div class="auth-visual grid-texture">
    <span class="brand-mark">GTI STAFF</span>
    <h1>Government Technical Institute</h1>
    <p>Staff and admin sign-in. Use this page to manage students, announcements, and the timetable.</p>
  </div>

  <div class="auth-panel">
    <button type="button" class="btn-icon-light theme-toggle-corner" id="themeToggleBtn" aria-label="Toggle dark mode">☾</button>

    <h2>Staff sign in</h2>
    <p class="subtitle">Sign in with your staff email.</p>

    <form id="staffSignInForm" novalidate autocomplete="on">
      <label for="staffEmail">Email</label>
      <input type="email" id="staffEmail" name="email" autocomplete="username" required maxlength="254">

      <label for="staffPassword">Password</label>
      <input type="password" id="staffPassword" name="password" autocomplete="current-password" required minlength="8" maxlength="128">

      <div class="sr-only" aria-hidden="true">
        <label for="staffCompanyWebsite">Leave blank</label>
        <input type="text" id="staffCompanyWebsite" name="companyWebsite" tabindex="-1" autocomplete="off">
      </div>

      <p class="status-message" id="staffSignInStatus" role="alert"></p>

      <button type="submit" class="btn btn-block" id="staffSignInSubmit">Sign in</button>
    </form>

    <p style="margin-top:20px; font-size:0.85rem;"><a href="index.html">Student sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="lecturer-login.js"></script>
</body>
</html>

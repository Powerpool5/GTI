name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 4:27 AM UTC (bypasses peak traffic delays)
    - cron: '27 4 */3 * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to Supabase Profiles Table
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -i -X GET "https://supabase.co" \
          -H "apikey: ${SUPABASE_ANON_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

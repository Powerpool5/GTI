<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://iqcwrberwzumxxjktgux.supabase.co; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<title>GTI Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<link rel="icon" type="image/x-icon" href="gti.png">

</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">GTI</span>
    <h1>Student Portal</h1>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="btn-icon" id="themeToggleBtn" type="button" aria-label="Toggle dark mode">☾</button>
    <div class="user-chip">
      <span id="avatarSlot"></span>
      <span id="headerName"></span>
    </div>
    <button class="btn btn-secondary" id="signOutButton" type="button" hidden style="border-color:rgba(255,255,255,0.4); color:#fff;">Sign out</button>
  </div>
</header>

<div id="loadingMessage" class="loading-state">
  <div class="skeleton skeleton-line" style="width:220px;"></div>
  <div class="skeleton skeleton-line" style="width:160px;"></div>
</div>

<div class="app-shell" id="appShell" hidden>
  <nav class="app-nav" role="tablist" aria-label="Portal sections">
    <button class="nav-item active" role="tab" aria-selected="true" aria-controls="overview" data-tab="overview">
      <span aria-hidden="true">▣</span> Overview
    </button>
    <button class="nav-item" role="tab" aria-selected="false" aria-controls="timetable" data-tab="timetable">
      <span aria-hidden="true">▥</span> Timetable
    </button>
    <button class="nav-item" role="tab" aria-selected="false" aria-controls="course" data-tab="course">
      <span aria-hidden="true">▧</span> Change course
    </button>
  </nav>

  <main class="app-main">

    <section id="overview" class="tab-content active">
      <h2>Your record</h2>
      <div class="card">
        <div class="detail-row"><span class="label">Name</span><span class="value" id="studentName"></span></div>
        <div class="detail-row"><span class="label">Student ID</span><span class="value" id="studentId"></span></div>
        <div class="detail-row"><span class="label">Email</span><span class="value" id="studentEmail"></span></div>
        <div class="detail-row"><span class="label">Course</span><span class="value" id="studentCourse"></span></div>
        <div class="detail-row"><span class="label">Status</span><span class="value" id="studentVerified"></span></div>
      </div>
      <div class="card" id="profileWarningCard" hidden>
        <p style="margin:0; color:var(--danger); font-size:0.88rem;" id="profileWarningText"></p>
      </div>
      <h2>Announcements</h2>
      <div class="card"><ul class="record-list" id="announcementsList"></ul></div>
    </section>

    <section id="timetable" class="tab-content">
      <h2>Timetable</h2>
      <div class="card"><ul class="record-list" id="timetableList"></ul></div>
    </section>

    <section id="course" class="tab-content">
      <h2>Change course</h2>
      <div class="card">
        <form id="courseChangeForm" novalidate>
          <label for="courseChange">Select a course</label>
          <select id="courseChange" required>
            <option value="">-- Select a Course --</option>
            <optgroup label="Building">
              <option value="TCAD_E">Technician Certificate in Architectural Drawing</option>
              <option value="TCBE1">Technician Certificate in Building and Civil Engineering Part 1</option>
              <option value="TCBE2">Technician Certificate in Building and Civil Engineering Part 2</option>
              <option value="PL1">Plumbing 1</option>
              <option value="PL2">Plumbing 2</option>
              <option value="GC1">General Construction 1</option>
              <option value="GC2">General Construction 2</option>
              <option value="FM1">Furniture Making 1</option>
              <option value="FM2">Furniture Making 2</option>
            </optgroup>
            <optgroup label="Business Department">
              <option value="ODC1">Ordinary Diploma in Commerce 1</option>
              <option value="ODC2">Ordinary Diploma in Commerce 2</option>
              <option value="GOA">General Office Administration</option>
              <option value="APP1">Diploma in Administrative Principles and Practices 1</option>
              <option value="APP2">Diploma in Administrative Principles and Practices 2</option>
            </optgroup>
            <optgroup label="Natural Sciences">
              <option value="ODCS1">Ordinary Diploma in Computer Science 1</option>
              <option value="ODCS2">Ordinary Diploma in Computer Science 2</option>
              <option value="DO1">Data Operations 1</option>
              <option value="DO2">Data Operations 2</option>
              <option value="ODS1">Ordinary Diploma in Science 1</option>
              <option value="ODS2">Ordinary Diploma in Science 2</option>
            </optgroup>
            <optgroup label="Electrical">
              <option value="ED1">Technician Diploma in Electrical Department 1</option>
              <option value="ED2">Technician Diploma in Electrical Department 2</option>
              <option value="EC1">Technician Certificate in Electrical Engineering 1</option>
              <option value="EC2">Technician Certificate in Electrical Engineering 2</option>
              <option value="EC3">Technician Certificate in Electrical Engineering 3</option>
              <option value="TC1">Technician Certificate in Telecommunications 1</option>
              <option value="TC2">Technician Certificate in Telecommunications 2</option>
              <option value="ETC1">Elementary Certificate in Telecommunications 1</option>
              <option value="ETC2">Elementary Certificate in Telecommunications 2</option>
              <option value="SAR">Small Appliance Repairs 1</option>
              <option value="SAR2">Small Appliance Repairs 2</option>
              <option value="AC1">Refrigeration and Air Conditioning 1</option>
              <option value="AC2">Refrigeration and Air Conditioning 2</option>
              <option value="ETE1">Electrical Installation 1</option>
              <option value="ETE2">Electrical Installation 2</option>
            </optgroup>
            <optgroup label="Mechanical">
              <option value="TDM1">Technician Diploma in Mechanical Engineering 1</option>
              <option value="TDM2">Technician Diploma in Mechanical Engineering 2</option>
              <option value="TCE1">Technician Certificate in Mechanical Engineering 1</option>
              <option value="TCE2">Technician Certificate in Mechanical Engineering 2</option>
              <option value="MWE1">Metal Work Engineering 1</option>
              <option value="MWE2">Metal Work Engineering 2</option>
              <option value="MVR1">Motor Vehicle Repairs 1</option>
              <option value="MVR2">Motor Vehicle Repairs 2</option>
              <option value="MVES1">Motor Vehicle Engine Systems 1</option>
              <option value="MVES2">Motor Vehicle Engine Systems 2</option>
              <option value="W1">Welding 1</option>
              <option value="W2">Welding 2</option>
              <option value="CCAM1">Craft Certificate in Agricultural Machinery 1</option>
              <option value="CCAM2">Craft Certificate in Agricultural Machinery 2</option>
            </optgroup>
            <optgroup label="Land Surveying">
              <option value="ODLS1">Ordinary Diploma in Land Surveying 1</option>
              <option value="ODLS2">Ordinary Diploma in Land Surveying 2</option>
            </optgroup>
          </select>
          <p class="status-message" id="courseStatus" role="alert"></p>
          <button type="submit" class="btn" id="courseSubmit">Save course</button>
        </form>
      </div>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="home.js"></script>
</body>
</html>

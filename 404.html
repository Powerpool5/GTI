<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Every link and asset on this page is relative to this <base>, so it renders correctly
     at any URL depth (e.g. /some/missing/page). If the portal is hosted in a sub-folder
     rather than at the site root, change href="/" to that folder, e.g. href="/portal/". -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<title>404 · Page not found - GTI Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20">
<script src="theme.js"></script>
<link rel="icon" type="image/x-icon" href="gti.png">
</head>
<body data-code="404">

<div class="auth-screen">
  <div class="auth-visual grid-texture">
    <span class="brand-mark">GTI</span>
    <h1>Government Technical Institute</h1>
    <p>Timetables, announcements and your course record, all in one place. Sorry for the detour.</p>
  </div>

  <div class="auth-panel">
    <button type="button" class="btn-icon-light theme-toggle-corner" id="themeToggleBtn" aria-label="Toggle dark mode">☾</button>

    <main class="auth-panel-card error-card">
      <p class="error-code" id="errorCode" aria-hidden="true">404</p>
      <h2 id="errorTitle">Page not found</h2>
      <p class="subtitle" id="errorMessage">This page doesn&#x27;t exist, has moved, or the link is out of date.</p>

      <p class="error-path" id="errorPath" hidden></p>

      <div class="error-actions" id="errorActions">
        <a class="btn" data-action="portal" href="home.html">Go to the portal</a>
        <button type="button" class="btn btn-secondary" data-action="back">Go back</button>
        <a class="btn btn-secondary" data-action="signin" href="index.html" hidden>Sign in</a>
        <button type="button" class="btn btn-secondary" data-action="retry" hidden>Try again</button>
      </div>

      <p class="error-meta" id="errorMeta"></p>
      <p class="error-links"><a href="index.html">Student sign in</a> <a href="lecturer-login.html">Staff login</a></p>
    </main>
  </div>
</div>

<script src="error-page.js?v=1"></script>
</body>
</html>

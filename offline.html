<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b3972">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'sha256-vvt4KWwuNr51XfE5m+hzeNEGhiOfZzG97ccfqGsPwvE='; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self';">
<title>Student Portal - GTI</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=15">
<script src="theme.js"></script>
<link rel="icon" type="image/x-icon" href="gti.png">
</head>
<body class="portal-home">

<header class="app-header grid-texture">
  <div class="brand">
    <span class="brand-mark">GTI</span>
    <h1>Student Portal</h1>
  </div>
  <div class="header-actions">
    <div class="user-chip" id="offlineUser" hidden>
      <span id="avatarSlot"></span>
      <span id="headerName"></span>
    </div>
    <button class="btn btn-secondary" id="offlineSignOut" type="button" hidden disabled style="border-color:rgba(255,255,255,0.4); color:#fff;">Sign out</button>
  </div>
</header>

<div class="app-shell">
  <nav class="app-nav" role="tablist" aria-label="Portal sections">
    <div class="nav-logo"><img src="gti.png" alt="GTI logo"></div>
    <button class="nav-item" role="tab" aria-selected="false" aria-disabled="true" tabindex="-1">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6.25" stroke="currentColor" stroke-width="1.4"/><path d="M9 2.5V4.5M9 13.5V15.5M2.5 9H4.5M13.5 9H15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/></svg> Overview
    </button>
    <button class="nav-item active" role="tab" aria-selected="true">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7H15.5" stroke="currentColor" stroke-width="1.4"/><path d="M6 2V5M12 2V5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Timetable
    </button>
    <button class="nav-item" role="tab" aria-selected="false" aria-disabled="true" tabindex="-1">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 14.5V10M9 14.5V6M14 14.5V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Grades
    </button>
    <button class="nav-item" role="tab" aria-selected="false" aria-disabled="true" tabindex="-1">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 3.5H10.5C11.6 3.5 12.5 4.4 12.5 5.5V14.5H5.5C4.4 14.5 3.5 13.6 3.5 12.5V3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.5 5.5H13.5C13.5 5.5 14.5 5.5 14.5 6.5V13.5C14.5 13.5 14.5 14.5 13.5 14.5H5.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 6.5H10M6 9H10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg> Resources
    </button>
    <button class="nav-item" role="tab" aria-selected="false" aria-disabled="true" tabindex="-1">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 6.5H12.5L10 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 11.5H5.5L8 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Change course
    </button>
    <button class="nav-item" role="tab" aria-selected="false" aria-disabled="true" tabindex="-1">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 4.5H14.5C15 4.5 15.5 5 15.5 5.5V11.5C15.5 12 15 12.5 14.5 12.5H8L5 15V12.5H3.5C3 12.5 2.5 12 2.5 11.5V5.5C2.5 5 3 4.5 3.5 4.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg> Feedback
    </button>
  </nav>

  <main class="app-main">
    <section id="timetable" class="tab-content active">
      <h2>Timetable</h2>
      <p class="status-message" id="offlineNotice" role="alert"></p>
      <div class="card"><ul class="record-list" id="timetableList"></ul></div>
    </section>
  </main>
</div>

<script src="timetable-cache.js"></script>
<script src="timetable-editor.js?v=6"></script>
<script src="offline.js"></script>
<script src="pwa.js?v=2"></script>
</body>
</html>

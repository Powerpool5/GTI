<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b3972">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self';">
<title>Student Portal - GTI</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- This page is deliberately self-contained: its own copy of the site's styles
     and its own script, so it still looks and works if nothing else can be loaded.
     The live stylesheet below overrides the built-in copy whenever it is available. -->
<style>
/* =========================================================
   GTI Student Portal — Design System v3
   Blueprint/drafting concept. v3 adds dark mode (data-theme
   on <html>) and drops the Google-sign-in-only components.
   ========================================================= */

:root {
  --ink-navy: #0b3972;
  --ink-navy-deep: #09396d;
  --blueprint: #2B5F8C;
  --blueprint-soft: #DCE6EE;
  --on-dark-soft: #DCE6EE; /* text on the always-dark header/auth-visual — must NOT flip in dark mode, since those surfaces are already dark in both themes */
  --paper: #FBFAF7;
  --paper-line: #E4E0D6;
  --surface: #FFFFFF;
  --border-input: #C7CDD3;
  --ink: #16232E;
  --slate: #5C6B78;
  --brass: #B8863B;
  --brass-dark: #96692A;
  --success: #3F7D5C;
  --success-bg: #E8F1EC;
  --danger: #B24C3F;
  --danger-bg: #FBEBE8;

  --font-display: "Space Grotesk", "IBM Plex Sans", sans-serif;
  --font-body: "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;

  --radius: 14px;
  --radius-sm: 8px;
  --sidebar-w: 240px;
  --max-content: 780px;

  --shadow-sm: 0 1px 2px rgba(16, 36, 61, 0.06);
  --shadow-md: 0 4px 16px rgba(16, 36, 61, 0.08);
  --shadow-lg: 0 12px 32px rgba(16, 36, 61, 0.14);
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  color-scheme: light;
}

[data-theme="dark"] {
  --paper: #121A22;
  --paper-line: #29323B;
  --surface: #1B2530;
  --border-input: #37424D;
  --ink: #E6E3DA;
  --slate: #97A2AB;
  --blueprint-soft: #1D3448;
  --success-bg: #163226;
  --danger-bg: #3A1F1C;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

/* Admin panel gets its own accent color (red instead of the site's
   usual navy/blue) so it visually reads as a distinct, higher-stakes
   area — same technique as the dark-mode override above, just scoped
   to admin.html's <body> instead of [data-theme="dark"]. Everything
   built on these tokens (header background, headings, active nav
   highlight, links, badges) picks it up automatically; nothing else
   needs to change. Header background/text intentionally doesn't
   change between light/dark site themes (same as the navy header does
   everywhere else) — only the soft tint used for hover/active
   backgrounds needs its own dark-mode variant, since that one does
   normally flip. */
body.theme-admin {
  --ink-navy: #7A1F1F;
  --ink-navy-deep: #611818;
  --blueprint: #A83232;
  --blueprint-soft: #F5DCDA;
}
[data-theme="dark"] body.theme-admin {
  --blueprint-soft: #3A2222;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body { transition: background 0.2s var(--ease), color 0.2s var(--ease); }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0 0 0.5em 0; letter-spacing: -0.01em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.05rem; color: var(--ink-navy); }
[data-theme="dark"] h2 { color: var(--ink); }
p { margin: 0 0 1em 0; }
a { color: var(--blueprint); }
button, input, select { font-family: inherit; font-size: 1rem; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.grid-texture {
  background-image:
    linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* =========================
   App shell
   ========================= */

.app-header {
  background: var(--ink-navy);
  color: #fff;
  padding: 14px 20px;
  /* On a notched/Dynamic-Island phone, `viewport-fit=cover` (index.html
     etc.) lets the page draw under the status bar — without this,
     the header's own content (brand mark, theme toggle) would sit
     right under the notch instead of below it. env() is 0 on any
     browser/device that doesn't need it, so this is a no-op there —
     same reasoning as the bottom nav's safe-area-inset-bottom padding
     below (.app-nav, max-width: 760px). */
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--brass);
  box-shadow: var(--shadow-md);
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header .brand { display: flex; align-items: baseline; gap: 10px; }

.app-header .header-actions { display: flex; align-items: center; gap: 16px; }

.app-header .brand-mark {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  color: var(--brass);
  border: 1px solid var(--brass);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}

.app-header h1 { font-size: 1.1rem; margin: 0; color: #fff; }
.app-header a.brand-link { text-decoration: none; }

.app-header .user-chip {
  font-size: 0.85rem;
  color: var(--on-dark-soft);
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-icon {
  background: none;
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s var(--ease);
}
@media (hover: hover) {
  .btn-icon:hover { background: rgba(255,255,255,0.12); }
}

/* Same control, used on the light auth screens (login/staff login) */
.btn-icon-light {
  background: none;
  border: 1px solid var(--border-input);
  color: var(--ink);
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s var(--ease);
}
@media (hover: hover) {
  .btn-icon-light:hover { background: var(--blueprint-soft); }
}

.avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.35);
  object-fit: cover;
}

.avatar-fallback {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blueprint);
  color: #fff;
  font-family: var(--font-display);
  font-size: 0.75rem;
  display: flex; align-items: center; justify-content: center;
}

.app-shell {
  display: flex;
  min-height: calc(100vh - 58px);
  /* iOS/Android browsers resize the *visual* viewport (not the layout
     one) when the address bar shows/hides, but plain `vh` is based on
     the layout viewport — so it's briefly wrong on load and only
     corrects itself once a scroll forces a reflow. `dvh` tracks the
     real, current viewport and fixes that; kept second, after the vh
     line above, purely as a fallback for older browsers that don't
     support dvh yet. */
  min-height: calc(100dvh - 58px);
}

.app-nav {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--paper-line); padding: 20px 0;
  /* Stays put while .app-main scrolls, instead of scrolling away with the
     page. Offset by the height of the sticky header — and, when a
     banner is showing above it, the banner too — kept in sync via
     --header-height, set by app.js's updateHeaderHeightVar(). Not used
     on mobile, where this nav becomes a fixed bottom bar instead (see
     the responsive rules below). */
  position: sticky;
  top: var(--header-height, 58px);
  align-self: flex-start;
  max-height: calc(100vh - var(--header-height, 58px));
  overflow-y: auto;
}

.nav-logo { display: flex; justify-content: center; padding: 4px 12px 20px; }
.nav-logo img { width: 200px; max-width: 100%; height: auto; display: block; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: calc(100% - 20px);
  margin: 2px 10px;
  background: none; border: none;
  text-align: left;
  text-decoration: none;
  padding: 11px 14px;
  border-radius: 10px;
  color: var(--slate);
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}
/* Without this, the hidden attribute does nothing on nav items: the
   rule above always sets display:flex, which (being an author
   stylesheet rule) beats the browser's built-in [hidden]->display:none
   default even though it's not aimed at [hidden] elements specifically.
   Affects every conditionally-shown nav item — Admin panel link,
   System tab, staff dashboard link — not just one. */
.nav-item[hidden] { display: none; }
@media (hover: hover) {
  .nav-item:hover { background: var(--blueprint-soft); color: var(--ink-navy); }
}
@media (hover: hover) {
  [data-theme="dark"] .nav-item:hover { color: var(--ink); }
}
.nav-item.active { background: var(--ink-navy); color: #fff; font-weight: 600; }
.nav-item .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  background: var(--brass);
  color: #fff;
  border-radius: 999px;
  padding: 1px 7px;
}

.app-main { flex: 1; padding: 32px 24px 64px; max-width: var(--max-content); }
.app-main.wide { max-width: 1040px; }

.tab-content { display: none; }
.tab-content.active { display: block; animation: reveal 0.25s var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .tab-content.active { animation: none; } }

/* =========================
   Cards
   ========================= */

.card {
  background: var(--surface);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s var(--ease), background 0.2s var(--ease);
}

.card-row-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }

.detail-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--paper-line); font-size: 0.95rem; }
.detail-row:last-child { border-bottom: none; }
.detail-row .label { color: var(--slate); }
.detail-row .value { font-family: var(--font-mono); font-size: 0.9rem; text-align: right; }

/* =========================
   Lists
   ========================= */

ul.record-list { list-style: none; margin: 0; padding: 0; }
.record { padding: 14px 0; border-bottom: 1px solid var(--paper-line); }
.record:last-child { border-bottom: none; }
.record-title { font-weight: 600; margin-bottom: 3px; }
.record-meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--blueprint); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.record-body { color: var(--slate); font-size: 0.92rem; }
.record a.file-link { display: inline-block; margin-top: 6px; font-size: 0.85rem; text-decoration: none; border-bottom: 1px dashed var(--blueprint); }
.grade-breakdown { margin-top: 6px; }
.record-actions { display: flex; gap: 10px; margin-top: 8px; }
.empty-state { color: var(--slate); font-size: 0.92rem; padding: 8px 0; }

.badge {
  display: inline-block;
  font-size: 0.7rem;
  font-family: var(--font-mono);
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.03em;
}
.badge-course { background: var(--blueprint-soft); color: var(--blueprint); }
.badge-all { background: #EFE6D4; color: var(--brass-dark); }
.badge-everyone { background: var(--danger-bg); color: var(--danger); }
.badge-admin { background: var(--ink-navy); color: #f1f1eb; }
.badge-staff { background: var(--brass); color: #fff; }
.badge-student { background: var(--blueprint-soft); color: var(--blueprint); }
.badge-verified { background: var(--success-bg); color: var(--success); }
.badge-unverified { background: var(--paper-line); color: var(--slate); }
.badge-inactive { background: var(--danger-bg); color: var(--danger); }
.badge-grade-a { background: var(--success-bg); color: var(--success); }
.badge-grade-b { background: var(--blueprint-soft); color: var(--blueprint); }
.badge-grade-c { background: #EFE6D4; color: var(--brass-dark); }
.badge-grade-f { background: var(--danger-bg); color: var(--danger); }
.badge-gpa { background: var(--brass); color: #fff; }

/* Closed tickets collapse to a single summary line (native <details>,
   so no extra JS/CSP-inline handlers are needed to expand them). */
.ticket-compact summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.ticket-compact summary::-webkit-details-marker { display: none; }
.ticket-compact summary::before {
  content: "▸";
  display: inline-block;
  font-size: 0.7rem;
  color: var(--slate);
  transition: transform 0.15s var(--ease);
}
.ticket-compact[open] summary::before { transform: rotate(90deg); }
.ticket-compact summary .record-title { margin: 0; }
.ticket-compact-body { margin-top: 12px; }

/* Archived-attendance week groups — same collapsible <details> idea
   as .ticket-compact above, but each group is its own full .card
   rather than a line in a list. */
.archive-week-group summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 12px;
}
.archive-week-group summary::-webkit-details-marker { display: none; }
.archive-week-group summary .archive-week-label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.archive-week-group summary .archive-week-label::before {
  content: "▸";
  display: inline-block;
  font-size: 0.7rem;
  color: var(--slate);
  transition: transform 0.15s var(--ease);
}
.archive-week-group[open] summary .archive-week-label::before { transform: rotate(90deg); }
.archive-week-group-body { margin-top: 16px; }

/* =========================
   Forms
   ========================= */

label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--ink-navy); margin-bottom: 6px; }
[data-theme="dark"] label { color: var(--ink); }

input[type="email"], input[type="password"], input[type="text"], input[type="time"],
input[type="search"], input[type="date"], input[type="number"],
select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-input);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  margin-bottom: 16px;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  -webkit-appearance: none;
  appearance: none;
}
/* Restore the calendar/dropdown affordances appearance:none strips,
   themed to match currentColor instead of the OS default icon. */
input[type="date"]::-webkit-calendar-picker-indicator { filter: var(--date-icon-filter, none); cursor: pointer; }
[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
/* Mobile WebKit/Blink (iOS Safari, Android Chrome) keep rendering
   type="search" fields with their own native rounded/light "pill" look —
   including a background that ignores our --surface color and never
   flips with dark mode — even with -webkit-appearance:none above.
   -webkit-appearance:textfield is the one value that reliably strips
   that native chrome down to a plain text field on those browsers;
   restating background/border here too in case the native style had
   been winning on those. */
input[type="search"] {
  -webkit-appearance: textfield;
  appearance: textfield;
  background: var(--surface);
  border: 1px solid var(--border-input);
  color: var(--ink);
}
input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
textarea { resize: vertical; min-height: 90px; }
input:focus, select:focus, textarea:focus { border-color: var(--blueprint); box-shadow: 0 0 0 3px rgba(43,95,140,0.12); outline: none; }
input:disabled, select:disabled, button:disabled { opacity: 0.55; cursor: not-allowed; }
.field-hint { font-size: 0.78rem; color: var(--slate); margin-top: -12px; margin-bottom: 16px; }

/* Password show/hide toggle — see initPasswordToggles() in app.js.
   Margin lives on the wrapper instead of the input so the eye button
   can be centered with a plain top:50% without fighting the input's
   own bottom margin. */
.password-field { position: relative; margin-bottom: 16px; }
.password-field input[type="password"], .password-field input[type="text"] {
  margin-bottom: 0;
  padding-right: 42px;
}
.password-toggle {
  position: absolute;
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: none;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--slate);
  cursor: pointer;
  transition: color 0.15s var(--ease), background 0.15s var(--ease);
}
@media (hover: hover) {
  .password-toggle:hover { color: var(--ink-navy); background: var(--blueprint-soft); }
}
@media (hover: hover) {
  [data-theme="dark"] .password-toggle:hover { color: var(--ink); }
}
.password-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.field-row { display: flex; gap: 14px; }
.field-row > div { flex: 1; }

/* =========================
   Course picker (searchable combobox)
   See enhanceCourseSelect() in app.js — the real <select> stays in
   the DOM (hidden) as the source of truth; this is just its skin.
   ========================= */
.course-combo { position: relative; margin-bottom: 16px; }
.course-combo-native {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.course-combo-input {
  margin-bottom: 0;
  padding-right: 30px;
  cursor: pointer;
  background-image: none;
  font-family: var(--font-body);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.course-combo::after {
  content: "▾";
  position: absolute;
  right: 12px;
  top: 12px;
  color: var(--slate);
  pointer-events: none;
  font-size: 0.75rem;
}
.course-combo.open .course-combo-input {
  border-color: var(--blueprint);
  box-shadow: 0 0 0 3px rgba(43,95,140,0.12);
}
.course-combo-panel {
  position: fixed;
  z-index: 1000;
  background: var(--surface);
  border: 1px solid var(--border-input);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  max-height: 320px;
  overflow-y: auto;
  padding: 4px;
}
/* Accordion department headers (shown when the box isn't being
   searched) — collapsed by default, click to reveal that
   department's courses instead of scrolling past everyone else's. */
.course-combo-group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 9px 10px;
  margin: 1px 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.86rem;
  color: var(--ink-navy);
  letter-spacing: -0.005em;
}
[data-theme="dark"] .course-combo-group-header { color: var(--ink); }
@media (hover: hover) {
  .course-combo-group-header:hover { background: var(--blueprint-soft); }
}
.course-combo-group-header .course-combo-group-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--slate);
  background: var(--paper-line);
  border-radius: 999px;
  padding: 1px 7px;
}
.course-combo-group-header .course-combo-group-chevron {
  font-size: 0.9rem;
  color: var(--slate);
  transition: transform 0.15s var(--ease);
  width: 12px;
  text-align: center;
}
.course-combo-group-header.open .course-combo-group-chevron { transform: rotate(90deg); }
/* Plain group label used only in search results, where every match is
   already shown flat regardless of department — no click target. */
.course-combo-group-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--slate);
  padding: 10px 10px 4px;
}
.course-combo-option {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 8px 10px;
  margin: 1px 0;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.88rem;
  color: var(--ink);
  cursor: pointer;
  line-height: 1.35;
}
.course-combo-option-name { flex: 1; }
.course-combo-option-code {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--slate);
  background: var(--paper-line);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
}
.course-combo-option.active .course-combo-option-code { color: var(--ink-navy); }
[data-theme="dark"] .course-combo-option.active .course-combo-option-code { color: var(--ink); }
.course-combo-option.indented { padding-left: 20px; } /* nested under an open accordion header */
.course-combo-option.highlighted { background: var(--blueprint-soft); }
@media (hover: hover) {
  .course-combo-option:hover { background: var(--blueprint-soft); }
}
.course-combo-option.active { font-weight: 600; color: var(--ink-navy); }
[data-theme="dark"] .course-combo-option.active { color: var(--ink); }
.course-combo-empty { padding: 14px 10px; font-size: 0.85rem; color: var(--slate); text-align: center; }

button.btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  background: var(--brass);
  color: #fff;
  transition: background 0.15s var(--ease), transform 0.1s var(--ease), box-shadow 0.15s var(--ease);
}
@media (hover: hover) {
  button.btn:hover:not(:disabled) { background: var(--brass-dark); box-shadow: var(--shadow-sm); }
}
button.btn:active:not(:disabled) { transform: translateY(1px); }
button.btn-block { width: 100%; }

button.btn-secondary { background: none; color: var(--blueprint); border: 1px solid var(--blueprint); }
@media (hover: hover) {
  button.btn-secondary:hover:not(:disabled) { background: var(--blueprint-soft); }
}

button.btn-danger { background: none; color: var(--danger); border: 1px solid var(--danger); }
@media (hover: hover) {
  button.btn-danger:hover:not(:disabled) { background: var(--danger-bg); }
}

button.btn-sm { padding: 6px 12px; font-size: 0.82rem; }

button.btn-link { background: none; border: none; color: var(--blueprint); padding: 0; font-size: 0.88rem; cursor: pointer; text-decoration: underline; }

.status-message { font-size: 0.88rem; padding: 10px 12px; border-radius: var(--radius-sm); margin-top: -6px; margin-bottom: 16px; display: none; }
.status-message.visible { display: block; }
.status-message.error { background: var(--danger-bg); color: var(--danger); }
.status-message.success { background: var(--success-bg); color: var(--success); }
.status-message.info { background: var(--blueprint-soft); color: var(--ink-navy); }
[data-theme="dark"] .status-message.info { color: var(--ink); }

/* =========================
   Locked feedback form (home.html — Feedback tab)
   Shown when an admin locks "Lecturer & course feedback" from the
   staff portal. Same warm, non-alarming tone as the lockdown page's
   brass accent, since this is an expected admin action, not an error.
   ========================= */
.form-locked-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  margin: -6px 0 16px;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--brass);
  background: var(--blueprint-soft);
  color: var(--ink-navy);
  font-size: 0.9rem;
  line-height: 1.4;
  box-shadow: var(--shadow-sm);
  animation: formLockedIn 0.2s var(--ease);
}
[data-theme="dark"] .form-locked-banner { color: var(--ink); }
.form-locked-banner[hidden] { display: none; }
@keyframes formLockedIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .form-locked-banner { animation: none; } }

/* Round icon badge (same idea as the lockdown page's lock badge, just
   inline-sized) instead of a bare glyph — gives the banner a bit more
   visual weight so it reads as a deliberate state, not an afterthought. */
.form-locked-icon-badge {
  flex-shrink: 0;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(184, 134, 59, 0.16);
  color: var(--brass-dark);
}
[data-theme="dark"] .form-locked-icon-badge { background: rgba(184, 134, 59, 0.22); color: var(--brass); }
.form-locked-icon { width: 15px; height: 15px; }

/* Small "Locked" pill next to the Feedback tab's own heading — visible
   the moment the tab is opened, before a student scrolls down to the
   banner sitting above the (now-disabled) form fields. */
h2 .locked-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  vertical-align: middle;
  margin-left: 10px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--brass-dark);
  background: rgba(184, 134, 59, 0.14);
  border: 1px solid var(--brass);
  border-radius: 999px;
  padding: 3px 9px 3px 7px;
}
[data-theme="dark"] h2 .locked-pill { color: var(--brass); background: rgba(184, 134, 59, 0.18); }
h2 .locked-pill[hidden] { display: none; }
h2 .locked-pill svg { width: 10px; height: 10px; flex-shrink: 0; }

/* Reset the browser's default fieldset chrome (border/padding/min-width)
   so it's invisible until :disabled — at which point the native
   disabled-fieldset behaviour (every field + the submit button inside
   stop accepting input, in one go) kicks in and this just dims it to
   show that's what happened. */
.feedback-fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
.feedback-fieldset:disabled { opacity: 0.55; }
.feedback-fieldset:disabled select,
.feedback-fieldset:disabled textarea,
.feedback-fieldset:disabled button { cursor: not-allowed; }

/* =========================
   Login / auth pages
   ========================= */

.auth-screen { min-height: 100vh; display: flex; background: var(--ink-navy-deep); }
.auth-visual {
  flex: 1.15;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 64px;
  color: #fff;
  position: relative;
  overflow: hidden;
}
/* Rotating background photos, one per department/stream — sits at the
   very back (z-index: 0). Pure CSS crossfade: every <img> shares one
   animation but starts at a different offset (negative delay), so
   exactly one is opaque at a time and the loop is seamless. Update the
   count below (6 images → 24s / 6 = 4s each) if you add or remove a
   stream photo. */
.auth-visual-slides { position: absolute; inset: 0; z-index: 0; }
.auth-visual-slides img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  animation: streamPhotoFade 24s infinite;
}
.auth-visual-slides img:nth-child(1) { animation-delay: 0s; }
.auth-visual-slides img:nth-child(2) { animation-delay: -4s; }
.auth-visual-slides img:nth-child(3) { animation-delay: -8s; }
.auth-visual-slides img:nth-child(4) { animation-delay: -12s; }
.auth-visual-slides img:nth-child(5) { animation-delay: -16s; }
.auth-visual-slides img:nth-child(6) { animation-delay: -20s; }
@keyframes streamPhotoFade {
  0%   { opacity: 0; }
  4%   { opacity: 1; }
  14%  { opacity: 1; }
  18%  { opacity: 0; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .auth-visual-slides img { animation: none; opacity: 0; }
  .auth-visual-slides img:first-child { opacity: 1; }
}
/* Navy tint over the photos so the white/brass text and grid lines
   stay legible no matter what's underneath — same tone as the old
   solid-navy background, just letting the photo show through it. */
.auth-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(165deg, rgba(7,27,52,0.94) 0%, rgba(11,57,114,0.82) 50%, rgba(5,18,36,0.95) 100%);
  pointer-events: none;
}
/* Soft brass glow in the corner — the kind of quiet, oversized light
   flare these reference sites use to keep a dark panel from feeling
   flat, without needing an actual image asset. Layered above the
   photo/tint, below the text. A second, dimmer glow low on the
   opposite side balances it so the panel doesn't read as lit from
   one corner only. */
.auth-visual::before {
  content: "";
  position: absolute;
  top: -160px;
  right: -140px;
  width: 460px;
  height: 460px;
  z-index: 2;
  background:
    radial-gradient(circle at center, rgba(184,134,59,0.34), transparent 70%),
    radial-gradient(circle at 15% 135%, rgba(43,95,140,0.4), transparent 60%);
  pointer-events: none;
}
.auth-visual > * { position: relative; z-index: 3; }
.auth-visual .brand-mark { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.1em; color: var(--brass); border: 1px solid var(--brass); display: inline-block; padding: 3px 8px; border-radius: var(--radius-sm); margin-bottom: 28px; width: fit-content; }
.auth-visual h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.4rem, 1.3rem + 3.4vw, 3.8rem);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: #fff;
  max-width: 520px;
  margin-bottom: 18px;
}
.auth-visual p { color: var(--on-dark-soft); max-width: 400px; margin-bottom: 24px; }
/* Real departments instead of a decorative eyebrow label — grounds
   the hero in what GTI actually teaches (see courses-data.js) rather
   than a generic "Student & Staff Portal" tagline. */
.auth-dept-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  list-style: none;
  padding: 0;
  margin: 0;
  max-width: 460px;
}
.auth-dept-tags li {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.02em;
  color: var(--on-dark-soft);
  border: 1px solid rgba(220,230,238,0.28);
  border-radius: 999px;
  padding: 5px 12px;
}

.auth-panel { flex: 1; min-width: 360px; max-width: 480px; background: var(--paper); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 40px; }
.auth-panel-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--paper-line);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  padding: 40px 36px;
}
.auth-panel h2 { font-size: 1.5rem; margin-bottom: 4px; }
.auth-panel .subtitle { color: var(--slate); font-size: 0.92rem; margin-bottom: 28px; }
.auth-panel .theme-toggle-corner { position: absolute; top: 20px; right: 20px; }

/* Segmented pill control instead of underlined tabs — reads more like
   a mode switch (sign in vs. create account are mutually exclusive
   states), which is what it actually is. */
.auth-tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 28px;
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: 999px;
  padding: 3px;
}
.auth-tab {
  flex: 1;
  background: none;
  border: none;
  border-radius: 999px;
  padding: 8px 4px;
  font-size: 0.86rem;
  color: var(--slate);
  cursor: pointer;
  transition: color 0.15s var(--ease), background 0.15s var(--ease);
}
.auth-tab.active { color: #fff; font-weight: 600; background: var(--ink-navy); }
[data-theme="dark"] .auth-tab.active { color: var(--paper); }
.auth-form { display: none; }
.auth-form.active { display: block; animation: authFormIn 0.32s var(--ease); }
@keyframes authFormIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.form-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 4px; }

@media (max-width: 860px) {
  .auth-screen { flex-direction: column; }
  .auth-visual {
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 18px 24px;
    overflow: visible;
  }
  .auth-visual::before, .auth-visual::after, .auth-visual-slides { display: none; }
  .auth-visual .brand-mark { margin-bottom: 0; }
  .auth-visual h1, .auth-visual p, .auth-dept-tags { display: none; }
  .auth-panel { max-width: none; min-width: 0; width: 100%; margin: 0; justify-content: flex-start; padding: 32px 20px; }
  .auth-panel-card { border: none; box-shadow: none; padding: 8px 4px; max-width: none; }
}

/* A little more polish specifically on the sign-in/sign-up panel —
   slightly larger radius and a hover lift on the submit button — kept
   scoped to .auth-panel for now rather than changed globally, since
   the rest of the app (tables, admin forms) hasn't been redesigned
   yet and shouldn't shift underneath it. */
.auth-panel input[type="email"],
.auth-panel input[type="password"],
.auth-panel input[type="text"],
.auth-panel select {
  padding: 12px 14px;
  border-radius: 10px;
}
.auth-panel button.btn {
  border-radius: 10px;
  padding: 13px 22px;
  letter-spacing: 0.01em;
  transition: background 0.15s var(--ease), transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
@media (hover: hover) {
  .auth-panel button.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
}
.auth-panel button.btn:active:not(:disabled) { transform: translateY(0); }

/* =========================
   Student dashboard hero banner
   Reuses the sign-in screen's dark navy / grid-texture / brass-glow
   system (see .auth-visual above) so the portal reads as the same
   product right after signing in, instead of switching to a plain
   generic dashboard look. One static photo rather than the slideshow
   used on .auth-visual — this is a returning-user banner, not a
   first-impression hero, so it doesn't need to keep cycling.
   ========================= */
.hero-banner {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  padding: 36px 34px;
  margin-bottom: 22px;
  color: #fff;
  background: var(--ink-navy-deep);
  box-shadow: var(--shadow-lg);
}
.hero-banner .hero-photo { position: absolute; inset: 0; z-index: 0; }
.hero-banner .hero-photo img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
.hero-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(165deg, rgba(7,27,52,0.94) 0%, rgba(11,57,114,0.82) 50%, rgba(5,18,36,0.95) 100%);
  pointer-events: none;
}
.hero-banner::before {
  content: "";
  position: absolute;
  top: -140px;
  right: -110px;
  width: 380px;
  height: 380px;
  z-index: 2;
  background:
    radial-gradient(circle at center, rgba(184,134,59,0.34), transparent 70%),
    radial-gradient(circle at 15% 135%, rgba(43,95,140,0.4), transparent 60%);
  pointer-events: none;
}
.hero-banner > * { position: relative; z-index: 3; }
.hero-banner h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.1rem);
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: #fff;
  margin-bottom: 6px;
}
.hero-banner .hero-sub { color: var(--on-dark-soft); font-size: 0.92rem; max-width: 440px; margin-bottom: 20px; }

/* Faint crest watermark — GTI's own emblem rather than a generic
   glow shape, grounding the hero in the institute's actual identity. */
.hero-banner .hero-crest {
  position: absolute;
  right: -30px;
  bottom: -30px;
  width: 200px;
  height: 200px;
  z-index: 1;
  opacity: 0.1;
  filter: brightness(0) invert(1);
  pointer-events: none;
}

/* Blueprint-style corner registration ticks, echoing the drafting
   instruments on the crest (compass, caliper) rather than a purely
   decorative glow. */
.hero-tick { position: absolute; z-index: 3; width: 16px; height: 16px; pointer-events: none; }
.hero-tick::before, .hero-tick::after { content: ""; position: absolute; background: rgba(220,230,238,0.4); }
.hero-tick::before { width: 100%; height: 1px; top: 50%; }
.hero-tick::after { width: 1px; height: 100%; left: 50%; }
.hero-tick-tl { top: 16px; left: 16px; }
.hero-tick-br { bottom: 16px; right: 16px; }

.hero-stats { display: flex; flex-wrap: wrap; gap: 22px; }
.hero-stat { display: flex; flex-direction: column; gap: 3px; }
.hero-stat-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--on-dark-soft); opacity: 0.8; }
.hero-stat-value { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: #fff; }
.hero-stat-value.tag-verified { color: #B7E0C8; }
.hero-stat-value.tag-pending { color: #F0D9AE; }

/* Radial GPA gauge — an instrument-style reading rather than a bare
   number, in keeping with the measuring tools on the crest. */
.gpa-gauge { display: flex; align-items: center; gap: 24px; }
.gpa-gauge svg { flex-shrink: 0; }
.gpa-ring-bg { stroke: var(--paper-line); }
.gpa-ring-fg { stroke: var(--brass); stroke-dasharray: 326.73; stroke-dashoffset: 326.73; transition: stroke-dashoffset 0.6s var(--ease); }
.gpa-gauge-center { display: flex; flex-direction: column; }
.gpa-gauge-value { font-family: var(--font-display); font-weight: 600; font-size: 2rem; color: var(--ink-navy); letter-spacing: -0.01em; }
[data-theme="dark"] .gpa-gauge-value { color: var(--ink); }
.gpa-gauge-label { font-size: 0.8rem; color: var(--slate); margin-top: 2px; }

@media (max-width: 760px) {
  .hero-banner { padding: 26px 22px; border-radius: 16px; }
  .hero-banner .hero-sub { max-width: none; }
  .hero-banner .hero-crest { width: 140px; height: 140px; right: -20px; bottom: -20px; }
  .hero-stats { gap: 16px; }
  .gpa-gauge { gap: 16px; }
  .gpa-gauge svg { width: 92px; height: 92px; }
}

/* Carries a few more auth-screen touches (pill nav, rounder cards, a
   button lift on hover) into the rest of the student portal, so the
   hero banner above doesn't read as a one-off graphic bolted onto an
   otherwise unrelated page. Scoped to home.html only — admin.html and
   lecturer-home.html aren't part of this pass. */
.portal-home .app-nav .nav-item { border-radius: 999px; }
.portal-home .card {
  border-radius: 18px;
  transition: box-shadow 0.2s var(--ease), background 0.2s var(--ease);
}
@media (hover: hover) {
  .portal-home .card:hover { box-shadow: var(--shadow-md); }
}
.portal-home select { border-radius: 10px; }
.portal-home button.btn {
  border-radius: 10px;
  transition: background 0.15s var(--ease), transform 0.1s var(--ease), box-shadow 0.15s var(--ease);
}
@media (hover: hover) {
  .portal-home button.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
}
.portal-home button.btn:active:not(:disabled) { transform: translateY(0); }

/* =========================
   Student dashboard — record cards
   Announcements / Timetable / Grades / Resources currently render as
   .record rows sharing one bottom-bordered .card, the same plain-list
   treatment used on admin.html/lecturer-home.html. This lifts them to
   match the rest of the student dashboard (hero banner, auth screens):
   each record becomes its own rounded, elevated card with a type
   colored left edge and icon, echoing the registration-tick/instrument
   language above. Scoped to home.html and lecturer-home.html (see the .staff-dashboard
   body class there) — admin.html keeps the plain shared version.
   ========================= */

.portal-home ul.record-list, .staff-dashboard ul.record-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.portal-home .record, .staff-dashboard .record {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--paper-line);
  border-left: 3px solid var(--blueprint);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease), background 0.2s var(--ease);
}
@media (hover: hover) {
  .portal-home .record:hover, .staff-dashboard .record:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
}

/* Accent variants, set by home.js from the record's own data (an
   announcement's audience, a grade's letter) rather than a fixed color
   per tab — reuses the same semantics as the existing .badge-* colors. */
.portal-home .record.accent-brass, .staff-dashboard .record.accent-brass { border-left-color: var(--brass); }
.portal-home .record.accent-success, .staff-dashboard .record.accent-success { border-left-color: var(--success); }
.portal-home .record.accent-danger, .staff-dashboard .record.accent-danger { border-left-color: var(--danger); }
.portal-home .record.accent-ink, .staff-dashboard .record.accent-ink { border-left-color: var(--ink-navy); }

.portal-home .record-head, .staff-dashboard .record-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.portal-home .record-head-main, .staff-dashboard .record-head-main { display: flex; align-items: flex-start; min-width: 0; }
.portal-home .record-head-text, .staff-dashboard .record-head-text { min-width: 0; }
.portal-home .record-title, .staff-dashboard .record-title { margin-bottom: 2px; }
.portal-home .record-meta, .staff-dashboard .record-meta { margin-bottom: 0; }
.portal-home .record-body, .staff-dashboard .record-body { margin-top: 8px; }

.portal-home .record-icon, .staff-dashboard .record-icon {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--blueprint-soft);
  color: var(--ink-navy);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-right: 10px;
  overflow: hidden;
}
.portal-home .record-icon svg, .staff-dashboard .record-icon svg { width: 15px; height: 15px; }
[data-theme="dark"] .portal-home .record-icon, [data-theme="dark"] .staff-dashboard .record-icon { color: var(--ink); }
.portal-home .record.accent-brass .record-icon, .staff-dashboard .record.accent-brass .record-icon { background: #EFE6D4; color: var(--brass-dark); }
.portal-home .record.accent-success .record-icon, .staff-dashboard .record.accent-success .record-icon { background: var(--success-bg); color: var(--success); }
.portal-home .record.accent-danger .record-icon, .staff-dashboard .record.accent-danger .record-icon { background: var(--danger-bg); color: var(--danger); }

/* Small pill action in the card header — a clearer call to action for
   "open this file" than the old dashed-underline text link buried
   after the body copy. */
.portal-home a.record-action, .staff-dashboard a.record-action {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.78rem;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--blueprint-soft);
  color: var(--ink-navy);
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.1s var(--ease);
}
[data-theme="dark"] .portal-home a.record-action, [data-theme="dark"] .staff-dashboard a.record-action { color: var(--ink); }
@media (hover: hover) {
  .portal-home a.record-action:hover, .staff-dashboard a.record-action:hover { background: var(--brass); color: #fff; }
}
.portal-home a.record-action:active, .staff-dashboard a.record-action:active { transform: translateY(1px); }

/* Grade breakdown becomes progressive disclosure — the header already
   carries course, letter grade and the two headline numbers (Grade,
   GPA) at a glance, so the four component scores are worth a click
   rather than always-on clutter. Same <details> pattern already used
   for closed tickets elsewhere in the product. */
.portal-home .grade-details, .staff-dashboard .grade-details { margin-top: 10px; }
.portal-home .grade-details summary, .staff-dashboard .grade-details summary {
  cursor: pointer;
  list-style: none;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--blueprint);
}
.portal-home .grade-details summary::-webkit-details-marker, .staff-dashboard .grade-details summary::-webkit-details-marker { display: none; }
.portal-home .grade-details summary::before, .staff-dashboard .grade-details summary::before { content: "Show component scores ▾"; }
.portal-home .grade-details[open] summary::before, .staff-dashboard .grade-details[open] summary::before { content: "Hide component scores ▴"; }
.portal-home .grade-details .grade-breakdown, .staff-dashboard .grade-details .grade-breakdown { margin-top: 8px; }
.portal-home .record .headline-row, .staff-dashboard .record .headline-row {
  display: flex; flex-wrap: wrap; gap: 18px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--paper-line);
}
.portal-home .record .headline-stat, .staff-dashboard .record .headline-stat { display: flex; flex-direction: column; gap: 2px; }
.portal-home .record .headline-stat .label, .staff-dashboard .record .headline-stat .label { font-size: 0.72rem; color: var(--slate); }
.portal-home .record .headline-stat .value, .staff-dashboard .record .headline-stat .value { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; color: var(--ink-navy); }
[data-theme="dark"] .portal-home .record .headline-stat .value, [data-theme="dark"] .staff-dashboard .record .headline-stat .value { color: var(--ink); }

/* Small dot marker for announcements posted in the last few days —
   quieter than another text badge crowding the meta row. */
.portal-home .record.is-new::after, .staff-dashboard .record.is-new::after {
  content: "";
  position: absolute;
  top: 16px; right: 16px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--brass);
  box-shadow: 0 0 0 3px var(--blueprint-soft);
}
[data-theme="dark"] .portal-home .record.is-new::after, [data-theme="dark"] .staff-dashboard .record.is-new::after { box-shadow: 0 0 0 3px rgba(184,134,59,0.3); }

/* Empty states get their own dashed placeholder card instead of a
   bare line of text, matching the elevated-card treatment above. */
.portal-home .card .empty-state, .staff-dashboard .card .empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  padding: 30px 16px;
  border: 1.5px dashed var(--paper-line);
  border-radius: 14px;
  color: var(--slate);
}
.portal-home .card .empty-state svg, .staff-dashboard .card .empty-state svg { opacity: 0.45; }

@media (max-width: 760px) {
  .portal-home .record-head, .staff-dashboard .record-head { flex-wrap: wrap; }
  .portal-home a.record-action, .staff-dashboard a.record-action { margin-top: 4px; }
}

/* =========================
   Toasts
   ========================= */

.toast-container {
  position: fixed;
  bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 999;
  max-width: 320px;
}
.toast {
  background: var(--ink-navy);
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
  border-left: 3px solid var(--brass);
}
.toast.visible { opacity: 1; transform: translateY(0); }
.toast.toast-error { border-left-color: var(--danger); }
.toast.toast-success { border-left-color: var(--success); }

/* =========================
   Staff dashboard: table + modal + stat cards
   ========================= */

.stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-card {
  flex: 1; min-width: 140px;
  background: var(--surface); border: 1px solid var(--paper-line); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow-sm);
}
.stat-card .stat-value { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; letter-spacing: -0.01em; color: var(--ink-navy); }
[data-theme="dark"] .stat-card .stat-value { color: var(--ink); }
.stat-card .stat-label { font-size: 0.78rem; color: var(--slate); letter-spacing: 0.01em; margin-top: 2px; }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.admin-table th {
  text-align: left; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--slate); padding: 10px 12px; border-bottom: 1px solid var(--paper-line);
}
table.admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--paper-line); vertical-align: middle; }
@media (hover: hover) {
  table.admin-table tr:hover td { background: var(--blueprint-soft); }
}
table.admin-table select, table.admin-table input { margin-bottom: 0; }
table.admin-table input[type="number"] { width: 72px; text-align: right; }
table.admin-table .grade-total { display: inline-block; min-width: 48px; font-family: var(--font-mono); font-weight: 600; text-align: right; }

/* Input Grades tab: renderStudentGradeBlock (lecturer-home.js) inserts
   one header row per student — spanning all 8 columns — followed by a
   plain <tr> per subject. Neither had any styling of its own before,
   so the header blended into the subject rows below it and ran
   straight into the previous student's last row with no separation. */
.grades-student-row td {
  background: var(--blueprint-soft);
  border-bottom: 1px solid var(--paper-line);
  padding: 10px 12px;
}
.grades-student-row:not(:first-child) td { border-top: 14px solid var(--surface); }
.grades-student-row-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 16px;
}
.grades-student-id-block { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grades-student-name { font-weight: 700; font-size: 0.96rem; color: var(--ink-navy); }
[data-theme="dark"] .grades-student-name { color: var(--ink); }
.grades-student-idtext { font-family: var(--font-mono); font-size: 0.78rem; color: var(--slate); }

/* Subject rows for a student sit between that student's own header row
   and the next one — a light left accent on the first cell keeps them
   visually grouped under their header without repeating the name on
   every row (border-collapse ignores a border set on the <tr> itself). */
table.admin-table #gradesTbody tr:not(.grades-student-row) td:first-child,
table.admin-table #studentGradesTbody tr:not(.grades-student-row) td:first-child {
  border-left: 3px solid var(--blueprint-soft);
  padding-left: 9px;
}

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
.chip {
  border: 1px solid var(--blueprint, var(--brass));
  background: none;
  color: var(--ink-navy);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 0.8rem;
  cursor: pointer;
}
[data-theme="dark"] .chip { color: var(--ink); }
@media (hover: hover) {
  .chip:hover { background: var(--blueprint-soft); }
}
.chip.chip-empty { color: var(--slate); border-style: dashed; cursor: default; }
@media (hover: hover) {
  .chip.chip-empty:hover { background: none; }
}

#myClassesRows {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}
.day-schedule-row {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 22px;
  min-height: 160px;
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius);
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s var(--ease);
}
@media (hover: hover) {
  .day-schedule-row:hover { border-color: var(--blueprint); box-shadow: var(--shadow-sm); }
}
.day-schedule-row .day-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
  font-size: 1.08rem;
  color: var(--ink-navy);
  padding-bottom: 12px;
  margin-bottom: 2px;
  border-bottom: 1px solid var(--paper-line);
}
[data-theme="dark"] .day-schedule-row .day-label { color: var(--ink); }

/* Highlights the current weekday in the My Classes schedule (see
   renderMyClassesForm in lecturer-home.js) so a lecturer can spot
   today's picks at a glance instead of scanning every card. */
.day-schedule-row.is-today {
  border-color: var(--blueprint);
  background: var(--blueprint-soft);
  box-shadow: 0 0 0 1px var(--blueprint);
}
.day-schedule-row.is-today .day-label { border-bottom-color: rgba(43,95,140,0.25); }
.day-label-today-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
  background: var(--blueprint);
  border-radius: 999px;
  padding: 2px 8px;
}
.day-schedule-row select { margin-bottom: 0; }
.day-schedule-picks { display: flex; flex-direction: column; gap: 10px; }
.day-schedule-pick { display: flex; align-items: center; gap: 8px; }
.day-schedule-pick select { flex: 1; min-width: 0; }
.day-schedule-remove {
  flex-shrink: 0;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border-input);
  background: none;
  color: var(--slate);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
}
@media (hover: hover) {
  .day-schedule-remove:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
}
.day-schedule-add {
  align-self: flex-start;
  background: none;
  border: none;
  padding: 2px 0;
  color: var(--blueprint);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
@media (hover: hover) {
  .day-schedule-add:hover { text-decoration: underline; }
}

.attendance-status-group { display: flex; gap: 6px; flex-wrap: wrap; }
.attendance-status-btn {
  border: 1px solid var(--slate);
  background: none;
  color: var(--slate);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 0.8rem;
  cursor: pointer;
}
.attendance-status-btn.present.active { background: #E4EFE7; border-color: #3E8558; color: #2F6B45; }
.attendance-status-btn.absent.active { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

/* Name/Student ID cells span down over a student's subject rows in
   the Attendance overview table — top-align them so they sit level
   with that student's first subject rather than centering across the
   whole span. */
#attendanceOverviewTable td[rowspan] { vertical-align: top; }

/* The save-attendance status message used to stretch the shared
   .status-message bar across the full width of the card, which reads
   as an oversized, heavy banner next to a small button. Scoped here
   to sit as a compact pill right beside the button instead. */
.attendance-save-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.attendance-save-row .status-message {
  margin: 0;
  flex: 0 1 auto;
  width: auto;
  border-radius: 999px;
  padding: 8px 16px;
}
.attendance-save-row .status-message.visible { display: inline-block; }

.attendance-summary-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 12px 16px;
  margin-top: 4px;
  background: var(--blueprint-soft);
  border-radius: var(--radius-sm);
}
.attendance-summary-card .attendance-summary-title { font-weight: 600; font-size: 0.9rem; color: var(--ink-navy); }
[data-theme="dark"] .attendance-summary-card .attendance-summary-title { color: var(--ink); }
.attendance-summary-card .attendance-summary-marked { font-size: 0.78rem; color: var(--slate); font-weight: 400; margin-left: 6px; }
.attendance-summary-card .attendance-summary-counts { display: flex; gap: 6px; flex-wrap: wrap; }

.search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
/* Plain <input>/<select> pick up `width: 100%` from the shared form-field
   rule above, which — inside a flex row — becomes each item's flex-basis.
   Two 100%-basis items in one row is what forced the search box onto its
   own line, then the course filter onto another, then the button onto a
   third, instead of sharing one row like the .course-combo variant
   already did. Giving them a sane, shrinkable basis instead of 100%
   fixes that on every screen size, not just mobile. */
.search-row input:not(.course-combo-input) { width: auto; flex: 1 1 180px; min-width: 140px; margin-bottom: 0; }
/* Date/time/number fields have a fixed, sensible native width — growing
   them the same way as a search box (above) is what stretched the
   Attendance date picker across almost the whole row. Keep these at
   their natural size instead. */
.search-row input[type="date"], .search-row input[type="time"], .search-row input[type="number"] {
  flex: 0 0 auto;
  width: auto;
  min-width: 0;
}
.search-row .attendance-date-weekday { flex: 0 0 auto; align-self: center; color: var(--slate); font-size: 0.85rem; white-space: nowrap; }
.search-row select { width: auto; flex: 0 1 220px; min-width: 140px; margin-bottom: 0; }
.search-row button { flex: 0 0 auto; }
.search-row .course-combo { margin-bottom: 0; flex: 2 1 280px; min-width: 260px; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(5, 18, 36, 0.62);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface); border-radius: var(--radius); padding: 26px;
  max-width: 480px; width: 100%; box-shadow: var(--shadow-lg);
  max-height: 90vh; overflow-y: auto;
}
.modal.modal-grades { max-width: 1040px; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.modal-header h2, .modal-header h3 { min-width: 0; overflow-wrap: break-word; }
.modal-close { flex-shrink: 0; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--slate); }

/* Skeleton loading */
.skeleton { background: linear-gradient(90deg, var(--paper-line) 25%, var(--surface) 37%, var(--paper-line) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius-sm); }
.skeleton-line { height: 14px; margin-bottom: 8px; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.loading-state { padding: 24px; color: var(--slate); }

/* =========================
   Responsive app shell
   ========================= */

@media (max-width: 760px) {
  .app-shell { flex-direction: column; }

  /* The section nav is a horizontal tab bar pinned to the TOP of the
     screen, directly under the sticky header/banner. It's sticky (not
     fixed) and sits first inside .app-shell, so it takes up its own
     space in the flow and needs no extra top padding on .app-main.
     --header-height is kept current by app.js (updateHeaderHeightVar). */
  .app-nav {
    position: sticky;
    top: var(--header-height, 58px);
    bottom: auto;
    align-self: stretch;
    z-index: 19; /* just under .app-header (20) / .sticky-top-wrap (21) */
    width: 100%;
    display: flex;
    align-items: center;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    max-height: none;
    padding: 6px 8px;
    gap: 2px;
    border-right: none;
    border-top: none;
    border-bottom: 1px solid var(--paper-line);
    box-shadow: 0 2px 10px rgba(16, 36, 61, 0.08);
  }
  /* The logo repeats the branding already shown in the header just
     above, and on a page with five or more tabs (lecturer-home.html)
     it was the difference between tabs merely being tight and tabs
     actually crowding into each other. Drop it here; it's still shown
     in the sidebar on desktop. */
  .nav-logo {
    display: none;
  }
  /* No actual icon image is ever put in here (still just an empty,
     aria-hidden span) — it only reserves an 18px-tall invisible box
     above the label. Harmless on desktop where the label sits next to
     it, but here the tab is a column, so that empty box sits above the
     label and pushes it down — the tab reads as bigger than its own
     text, with the text sitting near the bottom instead of centered.
     Only lecturer-home.html's tabs include this span at all (the
     admin/home nav buttons use a bare, class-less span with no
     reserved size), which is why only the staff dashboard showed it.
     Simplest fix: don't reserve the space on mobile since nothing's
     ever drawn there. */
  .nav-item .nav-icon {
    display: none;
  }
  .nav-item {
    /* Base rule sets width:100%, which is what stacked every tab into
       its own full-width row. On mobile this used to force every tab
       into an equal, shrinking share of the bar (flex: 1 1 0) — fine
       with 3-4 tabs, but on pages with 5+ tabs (lecturer-home.html)
       that squeezed each one below a usable width and their icon/label
       started crowding and overlapping each other. Give each tab a
       fixed, comfortable minimum width instead and let the bar itself
       scroll horizontally (overflow-x: auto, above) for whatever
       doesn't fit — swipeable, like a native app's tab bar, rather
       than crushed. */
    width: auto;
    margin: 0;
    flex: 0 0 auto;
    min-width: 68px;
    /* Keeps the label centered top-to-bottom in the box (matters once
       .nav-icon is hidden below — without this, column layout's default
       justify-content: flex-start leaves the label pinned to the top). */
    justify-content: center;
    scroll-snap-align: start;
    flex-direction: column;
    gap: 2px;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 6px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.68rem;
    text-align: center;
    background: transparent;
  }
  .nav-item.active { border-bottom-color: var(--brass); background: transparent; color: var(--ink-navy); font-weight: 600; }
  [data-theme="dark"] .nav-item.active { color: var(--ink); }

  /* The nav no longer sits at the bottom, so no extra room is needed
     down there beyond the phone's home-indicator inset. */
  .app-main { padding: 20px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .field-row { flex-direction: column; gap: 0; }

  /* Header: down to brand + theme toggle + avatar + sign-out. The
     subtitle, the dashboard-switch link's full text, and the name/email
     text all get trimmed here rather than being left to wrap or shrink
     themselves into something unreadable. */
  .app-header {
    /* No longer wraps to two rows — brand and header-actions now share
       one line (see below). flex-wrap stays on as a safety net only,
       in case a future addition ever genuinely doesn't fit. */
    flex-wrap: wrap;
    row-gap: 8px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }
  .app-header h1 { display: none; }
  /* Was width:100% + centered, which forced the brand onto its own
     full row and pushed header-actions (theme toggle/avatar/sign-out)
     down to a second row underneath. Now that the header no longer
     holds any nav-style links (those moved into the tab bar — see
     #staffDashboardNavLink / #adminPanelLink / the Student-view link
     in admin.html's nav), the brand is small enough to sit on the same
     line as the rest of the header controls, like on desktop. */
  .app-header .brand {
    gap: 6px;
  }
  .app-header .header-actions {
    gap: 8px;
    flex-wrap: nowrap;
  }

  /* Sign out was sized like a full desktop button — shrink it to match
     the other header controls instead of dominating the row. */
  .app-header #signOutButton {
    padding: 6px 12px;
    font-size: 0.8rem;
  }

  /* The name/email text was being squeezed into a max-width so small it
     rendered as just an ellipsis. Better to drop the text and rely on
     the avatar (which already shows an initial) than show "…". */
  .app-header .user-chip span:last-child { display: none; }

  /* Tables (Students/Staff/Attendance/Grades/Timetable) — tighten up so
     more columns fit before the horizontal scroll in .table-wrap kicks
     in, and give buttons/inputs inside cells a touch-friendly minimum
     size instead of the cramped desktop sizing. */
  table.admin-table { font-size: 0.82rem; }
  table.admin-table th, table.admin-table td { padding: 8px 8px; }
  table.admin-table .btn-sm { padding: 7px 10px; font-size: 0.78rem; }
  table.admin-table input[type="number"] { width: 58px; }

  /* Attendance table: Present/Absent/Late used to wrap onto a second
     line per student as soon as the Status column got squeezed by
     Name/Student ID next to it — force the three buttons to share one
     row and split whatever width is left evenly, instead of wrapping.
     Student ID is capped since it never needs more than a few
     characters, and Name is capped too (it already wraps onto two
     lines fine) so both hand their spare width over to Status, which
     is the column people actually need to tap. */
  #attendanceTable th:nth-child(1), #attendanceTable td:nth-child(1) { max-width: 88px; }
  #attendanceTable th:nth-child(2), #attendanceTable td:nth-child(2) { max-width: 52px; }
  /* The three buttons used to be jammed edge-to-edge with almost no
     inner padding, so the label text sat right against the button
     border — cramped rather than tappable. A bigger gap between
     buttons and more horizontal padding inside each gives the text
     real breathing room; the font size comes down slightly to make
     room for that padding without the row wrapping again. */
  #attendanceTable .attendance-status-group { flex-wrap: nowrap; gap: 6px; }
  #attendanceTable .attendance-status-btn {
    flex: 1 1 0;
    min-width: 0;
    padding: 8px 4px;
    font-size: 0.66rem;
    letter-spacing: -0.01em;
    text-align: center;
    white-space: nowrap;
  }

  /* Search/filter bars above tables: full-width stacked controls read
     far better on a narrow screen than several shrunken side-by-side
     inputs fighting for space. */
  .search-row { flex-direction: column; align-items: stretch; }
  .search-row input, .search-row select, .search-row .course-combo {
    width: 100%; flex: 1 1 auto; min-width: 0;
  }
  .search-row button { width: 100%; }

  /* Modals: use more of the viewport and trim the padding so forms
     don't feel squeezed against the edges of the screen. */
  .modal-backdrop { padding: 10px; align-items: flex-end; }
  .modal { padding: 18px; border-radius: 16px 16px 0 0; max-height: 92vh; }

  /* Card headers with a button/hint on the right (course counts,
     "+ Add" buttons, refresh actions, etc. across every tab) — stack
     them instead of squeezing both onto one crowded row. */
  .card-row-between { flex-direction: column; align-items: stretch; }
  .card-row-between > * { width: 100%; }

  /* Timetable table: reflows from a wide 4-column row into a single
     stacked card per course, each field labelled via the data-label
     set in renderTimetableRow() (lecturer-home.js) — much easier to
     read than shrinking 4 columns down to fit a phone screen. */
  #timetableTable thead { display: none; }
  #timetableTable, #timetableTable tbody, #timetableTable tr, #timetableTable td {
    display: block;
    width: 100%;
  }
  #timetableTable tr {
    margin-bottom: 12px;
    padding: 10px 12px;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  #timetableTable tr.empty-state, #timetableTable tr:has(.empty-state), #timetableTable tr:has(.skeleton) {
    border: none; background: none; padding: 0;
  }
  #timetableTable td {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--paper-line);
  }
  #timetableTable td:last-child { border-bottom: none; padding-top: 10px; justify-content: flex-start; }
  #timetableTable td[data-label]::before {
    content: attr(data-label);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--slate);
    flex-shrink: 0;
  }
  #timetableTable td[colspan] { display: block; }
  #timetableTable td[colspan]::before { content: none; }
}
/* Database-down banner (added by app.js's connectivity watchdog) */
/* Sticky wrapper (added by app.js only once a banner is actually
   needed) holding the banner and .app-header together as one unit.
   Sticking the wrapper — rather than the banner or header
   individually — means whatever it currently contains (header alone,
   or banner+header) stays pinned as-is; nothing has to compute or
   guess a height. See ensureStickyTopWrap() in app.js. */
.sticky-top-wrap {
  position: sticky;
  top: 0;
  z-index: 21;
}
.sticky-top-wrap .app-header {
  position: static; /* the wrapper is what's sticky now */
}
.db-down-banner {
  background: var(--danger, #b3261e);
  color: #fff;
  overflow: hidden;
  white-space: pre; /* like nowrap, but keeps the spaced-out separator between repeats from collapsing to one space */
  padding: 8px 0;
  font-family: var(--font-mono, "IBM Plex Mono", monospace);
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  /* Appearing/disappearing animates max-height + opacity (app.js measures
     and sets an exact px max-height so the transition has a real distance
     to cover, not the "snaps open the instant it clears 0" you get from
     animating max-height against an oversized guess). Switching between
     reasons (lockdown <-> maintenance <-> connectivity-down) never touches
     max-height at all — app.js crossfades the text/color of an
     already-open banner in place, and background-color/box-shadow below
     are what make that recolor read as a fade instead of a snap. */
  transition: max-height 380ms ease, opacity 260ms ease, background-color 320ms ease, box-shadow 320ms ease;
}
.db-down-banner[hidden] {
  display: none;
}
/* Root-authored banner styles (chosen from the System tab in admin.html).
   "down" keeps the original plain red — no color-coded stripe of its
   own like maintenance/lockdown below, since it's raised automatically
   by the connectivity watchdog rather than authored by a person. It
   does get its own pulse, though: unlike the other two, it means the
   app itself can't currently reach the database, so it's worth reading
   as more urgent than a static bar at a glance. */
.db-down-banner.down {
  animation: db-down-pulse 1.6s ease-in-out infinite;
}
@keyframes db-down-pulse {
  0%, 100% { background: var(--danger, #b3261e); }
  50% { background: #7a1710; }
}
.db-down-banner.maintenance-info {
  background: #2B6CB0;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25), inset 0 2px 0 #FF8C1A;
}
.db-down-banner.maintenance-warning {
  background: var(--brass-dark, #96692A);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25), inset 0 2px 0 #FF8C1A;
}
.db-down-banner.maintenance-danger {
  background: var(--danger, #B24C3F);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25), inset 0 2px 0 #FF8C1A;
}
.db-down-banner.lockdown-info {
  background: #1B3A5C;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}
.db-down-banner.lockdown-warning {
  background: #6B4310;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}
.db-down-banner.lockdown-danger {
  background: #6B1410;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}
.db-down-banner .db-down-track {
  /* Back-to-back copies of the same text, no leading padding — app.js
     decides HOW MANY copies (bannerRepeatCount, enough to keep the
     banner full for a short message on a wide screen) and sets
     --marquee-shift to exactly one copy's rendered width. Translating
     by that one-copy distance means the instant the loop resets to 0%,
     the next copy is already sitting exactly where the last one started
     — no blank stretch, no jump. A fixed percentage here (-50%, -100%)
     can't do that on its own: it only tiles seamlessly for the one
     message-length/banner-width ratio it happened to be tuned for. */
  display: inline-block;
  animation: db-down-scroll 16s linear infinite;
  transition: opacity 220ms ease; /* the crossfade app.js uses when swapping what the banner says */
}
/* Applied briefly by app.js while the old text is fading out, just
   before the new message/variant is swapped in underneath it. */
.db-down-banner .db-down-track.db-down-fade {
  opacity: 0;
}
/* The divider between repeats — its own element (app.js builds the
   strip from parts, not one text string) so it can look like a
   deliberate divider instead of a stray character sharing the
   message's own size/weight/color. */
.db-down-banner .db-down-dot {
  display: inline-block;
  opacity: 0.55;
  font-size: 0.7em;
  transform: translateY(-0.05em);
}
@keyframes db-down-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(calc(-1 * var(--marquee-shift, 50%))); }
}
@media (prefers-reduced-motion: reduce) {
  .db-down-banner {
    transition: none;
  }
  .db-down-banner .db-down-track {
    animation: none;
    transition: none;
  }
  .db-down-banner.down {
    animation: none;
    background: var(--danger, #b3261e);
  }
}
